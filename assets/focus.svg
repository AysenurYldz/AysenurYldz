<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268" width="1200" height="268" role="img" aria-label="Focus areas: Applied AI, Full Stack Engineering, Ship to Production">
  <title>Focus areas</title>
  <defs>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C97B94" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C97B94" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A8E8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5B93C4" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8CDEA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5B93C4" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A85A76"/><stop offset="100%" stop-color="#8B5FBF"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A8E8"/><stop offset="100%" stop-color="#5B93C4"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A8CDEA"/><stop offset="100%" stop-color="#A8CDEA"/>
    </linearGradient>
  </defs>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <!-- card 1 -->
    <g>
      <rect x="6" y="14" width="378" height="240" rx="20" fill="url(#c1)" stroke="#C97B94" stroke-opacity="0.55"/>
      <rect x="30" y="42" width="46" height="4" rx="2" fill="url(#bar1)"/>
      <g transform="translate(30,66)" stroke="#C97B94" fill="none" stroke-width="1.7" stroke-linecap="round">
        <circle cx="9" cy="9" r="3.2" fill="#C97B94" stroke="none"/>
        <circle cx="31" cy="1" r="2.6" fill="#A85A76" stroke="none"/>
        <circle cx="31" cy="17" r="2.6" fill="#A85A76" stroke="none"/>
        <path d="M12 7.5 L28.5 1.8 M12 10.5 L28.5 16.2"/>
      </g>
      <text x="76" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#2E2430">Applied AI</text>
      <text x="30" y="118" font-size="13.4" fill="#6E5F6A">Computer vision, OCR pipelines and</text>
      <text x="30" y="139" font-size="13.4" fill="#6E5F6A">real-time object detection with YOLO.</text>
      <text x="30" y="160" font-size="13.4" fill="#6E5F6A">NLP &amp; chatbots, anomaly detection,</text>
      <text x="30" y="181" font-size="13.4" fill="#6E5F6A">LSTM sequence models.</text>
      <text x="30" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#8A7A86">
        PYTORCH · TENSORFLOW · OPENCV · YOLO
      </text>
    </g>

    <!-- card 2 -->
    <g>
      <rect x="411" y="14" width="378" height="240" rx="20" fill="url(#c2)" stroke="#C9A8E8" stroke-opacity="0.55"/>
      <rect x="435" y="42" width="46" height="4" rx="2" fill="url(#bar2)"/>
      <g transform="translate(435,64)" stroke="#5B93C4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 3 L4 11 L13 19"/>
        <path d="M27 3 L36 11 L27 19"/>
      </g>
      <text x="481" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#2E2430">Full Stack Engineering</text>
      <text x="435" y="118" font-size="13.4" fill="#6E5F6A">Municipal, sports and HR platforms</text>
      <text x="435" y="139" font-size="13.4" fill="#6E5F6A">built end to end with Node.js and</text>
      <text x="435" y="160" font-size="13.4" fill="#6E5F6A">Next.js — front-end, back-end, APIs,</text>
      <text x="435" y="181" font-size="13.4" fill="#6E5F6A">with or without a model involved.</text>
      <text x="435" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#9C8C96">
        NEXT.JS · NODE.JS · FLASK · REST · SQL
      </text>
    </g>

    <!-- card 3 -->
    <g>
      <rect x="816" y="14" width="378" height="240" rx="20" fill="url(#c3)" stroke="#A8CDEA" stroke-opacity="0.55"/>
      <rect x="840" y="42" width="46" height="4" rx="2" fill="url(#bar3)"/>
      <g transform="translate(840,64)" stroke="#A8CDEA" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="1" width="22" height="20" rx="3"/>
        <path d="M8 26 L20 26"/>
        <path d="M31 5 L37 11 L31 17"/>
      </g>
      <text x="886" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#2E2430">Ship to Production</text>
      <text x="840" y="118" font-size="13.4" fill="#6E5F6A">Models do not stop at the notebook:</text>
      <text x="840" y="139" font-size="13.4" fill="#6E5F6A">containerised services, Triton/ONNX</text>
      <text x="840" y="160" font-size="13.4" fill="#6E5F6A">inference and Flutter apps that carry</text>
      <text x="840" y="181" font-size="13.4" fill="#6E5F6A">them to iOS and Android.</text>
      <text x="840" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#9C8C96">
        DOCKER · TRITON · ONNX · AZURE · FLUTTER
      </text>
    </g>
  </g>
</svg>
