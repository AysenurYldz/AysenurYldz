<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="r-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B18AE0" stop-opacity="0"/>
      <stop offset="14%" stop-color="#B18AE0" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#D99BB0" stop-opacity="0.34"/>
      <stop offset="86%" stop-color="#EFC3D3" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EFC3D3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B18AE0" stop-opacity="0"/>
      <stop offset="42%" stop-color="#C9AAF0" stop-opacity="0.95"/>
      <stop offset="58%" stop-color="#EFC3D3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EFC3D3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r-clip"><rect y="4" width="1000" height="2" rx="1"/></clipPath>
    <style>
      @media (prefers-reduced-motion: reduce){ .r-run{animation:none; display:none} }
    </style>
  </defs>

  <rect y="4" width="1000" height="2" rx="1" fill="url(#r-base)"/>

  <g clip-path="url(#r-clip)">
    <rect class="r-run" x="-260" y="4" width="260" height="2" fill="url(#r-spark)">
      <animate attributeName="x" values="-260;1000" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
