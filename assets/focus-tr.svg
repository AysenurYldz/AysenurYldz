<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268" width="1200" height="268" role="img" aria-label="Çalışma alanları: Uygulamalı Yapay Zekâ, Full Stack Geliştirme, Üretime Alma">
  <title>Çalışma alanları</title>
  <defs>
    <linearGradient id="u-c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.20"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="u-c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.20"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="u-c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="u-bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="u-bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="u-bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
  </defs>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">

    <g>
      <rect x="6" y="14" width="378" height="240" rx="20" fill="url(#u-c1)" stroke="#8B5CF6" stroke-opacity="0.34"/>
      <rect x="30" y="42" width="46" height="4" rx="2" fill="url(#u-bar1)"/>
      <g transform="translate(30,66)" stroke="#C4B5FD" fill="none" stroke-width="1.7" stroke-linecap="round">
        <circle cx="9" cy="9" r="3.2" fill="#C4B5FD" stroke="none"/>
        <circle cx="31" cy="1" r="2.6" fill="#A78BFA" stroke="none"/>
        <circle cx="31" cy="17" r="2.6" fill="#A78BFA" stroke="none"/>
        <path d="M12 7.5 L28.5 1.8 M12 10.5 L28.5 16.2"/>
      </g>
      <text x="76" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#EDE9FE">Uygulamalı Yapay Zekâ</text>
      <text x="30" y="118" font-size="13.4" fill="#B9B3E6">Belge ve görüntü analizi için bilgisayarlı</text>
      <text x="30" y="139" font-size="13.4" fill="#B9B3E6">görü ve OCR hatları. YOLO ile gerçek</text>
      <text x="30" y="160" font-size="13.4" fill="#B9B3E6">zamanlı nesne tespiti. NLP, chatbot ve</text>
      <text x="30" y="181" font-size="13.4" fill="#B9B3E6">anomali tespiti çözümleri.</text>
      <text x="30" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#8E86D8">
        PYTORCH · TENSORFLOW · OPENCV · YOLO
      </text>
    </g>

    <g>
      <rect x="411" y="14" width="378" height="240" rx="20" fill="url(#u-c2)" stroke="#6366F1" stroke-opacity="0.34"/>
      <rect x="435" y="42" width="46" height="4" rx="2" fill="url(#u-bar2)"/>
      <g transform="translate(435,64)" stroke="#93C5FD" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 3 L4 11 L13 19"/><path d="M27 3 L36 11 L27 19"/>
      </g>
      <text x="481" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#E6EEFE">Full Stack Geliştirme</text>
      <text x="435" y="118" font-size="13.4" fill="#AFC1E8">Node.js ve Next.js ile uçtan uca kurulan</text>
      <text x="435" y="139" font-size="13.4" fill="#AFC1E8">belediye, spor ve İK platformları — ön</text>
      <text x="435" y="160" font-size="13.4" fill="#AFC1E8">yüz, arka uç ve API'ler; işin içinde</text>
      <text x="435" y="181" font-size="13.4" fill="#AFC1E8">model olsun ya da olmasın.</text>
      <text x="435" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#7E92C8">
        NEXT.JS · NODE.JS · FLASK · REST · SQL
      </text>
    </g>

    <g>
      <rect x="816" y="14" width="378" height="240" rx="20" fill="url(#u-c3)" stroke="#22D3EE" stroke-opacity="0.30"/>
      <rect x="840" y="42" width="46" height="4" rx="2" fill="url(#u-bar3)"/>
      <g transform="translate(840,64)" stroke="#67E8F9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="1" width="22" height="20" rx="3"/><path d="M8 26 L20 26"/><path d="M31 5 L37 11 L31 17"/>
      </g>
      <text x="886" y="82" font-size="17.5" font-weight="700" letter-spacing="0.4" fill="#DFF6FB">Üretime Alma</text>
      <text x="840" y="118" font-size="13.4" fill="#A5CBD9">Modeller not defterinde kalmaz:</text>
      <text x="840" y="139" font-size="13.4" fill="#A5CBD9">konteynerleştirilmiş servisler,</text>
      <text x="840" y="160" font-size="13.4" fill="#A5CBD9">Triton/ONNX çıkarımı ve onları iOS ile</text>
      <text x="840" y="181" font-size="13.4" fill="#A5CBD9">Android'e taşıyan Flutter uygulamaları.</text>
      <text x="840" y="222" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#6FA5B8">
        DOCKER · TRITON · ONNX · AZURE · FLUTTER
      </text>
    </g>
  </g>
</svg>
