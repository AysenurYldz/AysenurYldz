name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Lilac / dusty-pink ramp matching the rest of the profile.
      # Light and dark variants; the README picks one with <picture>.
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%237B4FC0&color_dots=%23F6EDF4,%23E6CFE4,%23C9A2DC,%23D993AC,%23C9738F
            dist/snake-dark.svg?color_snake=%23C3A0F0&color_dots=%231E1428,%235C3A70,%239070C4,%23C58FC9,%23EFB6CC

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
