name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Lilac / dusty-pink ramp matching the rest of the profile.
      # Light and dark variants; the README picks one with <picture>.
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23A85A76&color_dots=%23F5EDF1,%23EBC9D8,%23DDA3BC,%23C97B94,%23A85A76
            dist/snake-dark.svg?color_snake=%23E4A8BC&color_dots=%232A1F26,%236B4152,%23A85A76,%23C97B94,%23EBC9D8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
