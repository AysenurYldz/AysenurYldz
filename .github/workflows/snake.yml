name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Kahve / bej sonbahar rampası — profilin geri kalanıyla aynı.
      # Light and dark variants; the README picks one with <picture>.
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%237A5240&color_dots=%23F3EEE8,%23E2CDB8,%23CFA984,%23A9785A,%237A5240
            dist/snake-dark.svg?color_snake=%23E6C27A&color_dots=%232A221C,%234A3A2E,%237A5240,%23A9785A,%23E2CDB8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
