name: Contribution Panels

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen-contrib.mjs"
      - ".github/workflows/contrib.yml"

concurrency:
  group: contrib
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Aynı script yerelde de çalışır: node tools/gen-contrib.mjs
      - name: Generate calendar, density and landscape panels
        run: node tools/gen-contrib.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-*.svg assets/iso-*.svg assets/landscape-*.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh contribution panels"
          git push
